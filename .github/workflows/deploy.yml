name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allow manual runs from the Actions tab

jobs:
  # Gate: the worker must pass the behavioral suite (malformed-input fuzz
  # + concurrency storms, run against a local wrangler dev instance)
  # before anything deploys. See tests/robustness/.
  robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Robustness suite
        run: npm run test:robustness

  deploy:
    needs: robustness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # wrangler.toml's [build] step runs `npm run build` (the React frontend) first.
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 988374702c17cd8942be6b35f8361735

      # One-time cleanup after email binding was removed: delete the worker's old
      # RESEND_API_KEY secret through the Cloudflare API. After the first run it
      # answers 404 (already gone), which is fine; this step can go later.
      - name: Remove old email secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          code=$(curl -s -o del.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/988374702c17cd8942be6b35f8361735/workers/scripts/denver-thanksgiving-airbnb-vote/secrets/RESEND_API_KEY")
          echo "delete RESEND_API_KEY: HTTP $code"; head -c 300 del.json; echo
