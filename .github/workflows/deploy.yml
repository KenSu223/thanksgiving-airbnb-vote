name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allow manual runs from the Actions tab

jobs:
  # Gate: the worker must pass the behavioral suite (malformed-input fuzz
  # + concurrency storms, run against a local wrangler dev instance)
  # before anything deploys. See tests/robustness/.
  robustness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Robustness suite
        run: npm run test:robustness

  deploy:
    needs: robustness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Optional: if the repo has a RESEND_API_KEY secret (repo Settings →
      # Secrets and variables → Actions), sync it into the worker so the
      # email-code login can send mail. Skipped silently when unset.
      - name: Sync email secret (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 988374702c17cd8942be6b35f8361735
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        if: env.RESEND_API_KEY != ''
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

      # wrangler.toml's [build] step runs `npm run build` (the React frontend) first.
      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 988374702c17cd8942be6b35f8361735
