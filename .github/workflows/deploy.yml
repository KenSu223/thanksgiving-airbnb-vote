name: Deploy to Cloudflare Workers

# Every push to main: the same checks as a PR (ci.yml), then deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:  # also allow manual runs from the Actions tab

# one deploy at a time, in order
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # wrangler.toml's [build] step runs `npm run build` (the page) first.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 988374702c17cd8942be6b35f8361735
