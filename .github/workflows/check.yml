name: Check

# Every PR must lint, build, and bundle the worker, so a bad merge
# resolution can't reach main and break the deploy.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Behavioral suite: boots the worker locally (wrangler dev, throwaway
  # state) and runs the malformed-input fuzz battery plus the concurrency
  # storms — the lost-update regression tests. See tests/robustness/.
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:robustness
