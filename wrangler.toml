name = "denver-thanksgiving-airbnb-vote"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Sender for verification-code email. peterming.net is verified in Resend
# (DKIM/SPF records in its Route 53 zone), so codes can go to any member's
# inbox; without this var the worker falls back to Resend's shared
# onboarding@resend.dev, which may only deliver to the account owner.
[vars]
EMAIL_FROM = "Denver Thanksgiving <noreply@peterming.net>"

# `wrangler deploy` / `wrangler dev` build the React frontend into ./dist first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "VOTES_KV"
id = "0c1964118e4c427aa9698fa13a5dcadf"

# Blackjack table: one Durable Object (SQLite storage, required on the free plan).
[[durable_objects.bindings]]
name = "BJ_TABLE"
class_name = "BlackjackTable"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlackjackTable"]

# 斗地主 room: one Durable Object (DdzHall) holding three tables.
[[durable_objects.bindings]]
name = "DDZ_HALL"
class_name = "DdzHall"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DdzHall"]

# 掼蛋 and 川麻 rooms: one Durable Object each, three tables of four.
[[durable_objects.bindings]]
name = "GD_HALL"
class_name = "GuandanHall"

[[durable_objects.bindings]]
name = "MJ_HALL"
class_name = "MahjongHall"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GuandanHall", "MahjongHall"]

# The storekeeper: one Durable Object (StoreDO) owning every mutable
# app document, so concurrent writes serialize instead of overwriting
# each other (KV has no locks; see worker/store/store.js).
[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["StoreDO"]

# 鲁班七号躲技能 leaderboard: one Durable Object that replays and keeps best runs.
[[durable_objects.bindings]]
name = "DODGE"
class_name = "DodgeBoard"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["DodgeBoard"]

# 2048: one Durable Object holding everyone's game in progress and best tile.
[[durable_objects.bindings]]
name = "G2048"
class_name = "Board2048"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["Board2048"]

# 谁是卧底: one Durable Object (party-game hall), two tables.
[[durable_objects.bindings]]
name = "UC_HALL"
class_name = "UndercoverHall"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["UndercoverHall"]

# 阿瓦隆: one Durable Object (party-game hall), two tables.
[[durable_objects.bindings]]
name = "AV_HALL"
class_name = "AvalonHall"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["AvalonHall"]

# 狼人杀: one Durable Object (party-game hall), two tables.
[[durable_objects.bindings]]
name = "WW_HALL"
class_name = "WerewolfHall"

[[migrations]]
tag = "v9"
new_sqlite_classes = ["WerewolfHall"]

# 在线状态: one Durable Object holding who has the app open + everyone's last-seen.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["PresenceDO"]
